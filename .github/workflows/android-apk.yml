
name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q AI3DStoryStudio_GitHub_Actions_Build.zip

      - name: Fix backend and character defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AI3DStoryStudio/app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
                    # Hide manual age and appearance fields; let AI infer them from the story
          old_age = '<div class="grid"><div class="field"><label>CHARACTER NAME</label><input id="charName" placeholder="e.g. Ashwatthama"></div><div class="field"><label>AGE / AGE RANGE</label><input id="charAge" placeholder="e.g. 35 years"></div></div>'
          new_age = '<div class="field"><label>CHARACTER NAME</label><input id="charName" placeholder="e.g. Ashwatthama"></div><input id="charAge" type="hidden" value="Automatically determine a suitable age from the story">'
          if old_age not in s:
              raise SystemExit("Character age field not found")
          s = s.replace(old_age, new_age, 1)

          old_appearance = '<div class="field"><label>FIXED PHYSICAL APPEARANCE & COSTUME</label><textarea id="appearance" style="min-height:75px" placeholder="Face, hair, body build, costume, colors, accessories..."></textarea></div>'
          new_appearance = '<input id="appearance" type="hidden" value="Automatically create a detailed character appearance and costume from the story, then keep it identical in every scene">'
          if old_appearance not in s:
              raise SystemExit("Character appearance field not found")
          s = s.replace(old_appearance, new_appearance, 1)

          s = s.replace(
              "document.querySelectorAll('input:not([type=checkbox]),textarea').forEach(e=>e.value='');",
              "document.querySelectorAll('input:not([type=checkbox]),textarea').forEach(e=>e.value='');$('charAge').value='Automatically determine a suitable age from the story';$('appearance').value='Automatically create a detailed character appearance and costume from the story, then keep it identical in every scene';",
              1
          )
          s = s.replace(
              '<div class="field"><label>SECURE BACKEND HTTPS URL</label><input id="aiEndpoint" type="url" placeholder="https://your-secure-server.example/generate"></div>',
              '<input id="aiEndpoint" type="hidden" value="https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate">'
          )
          s = s.replace(
              "age:val('charAge','As appropriate'),appearance:val('appearance')",
              "age:val('charAge','Automatically determine a suitable age from the story'),appearance:val('appearance','Automatically create a detailed character appearance and costume, then keep it identical in every scene')"
          )
          s = s.replace(
              "const endpoint=val('aiEndpoint');",
              "const endpoint=val('aiEndpoint','https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate');"
          )
          
          old_payload = "const payload=JSON.stringify(collectAiBrief());AndroidBridge.callAiBackend(endpoint,payload)"
         
          new_payload = "const brief=collectAiBrief();const prompt='You are an expert cinematic story production assistant. Create a complete scene-by-scene production blueprint. IMPORTANT: Create at least FOUR distinct recurring lead characters suitable for the story. For each character provide name, role, age, detailed face, hair, body build, costume, colors, accessories, personality, voice identity and a separate detailed CHARACTER REFERENCE IMAGE PROMPT. Keep all four characters visually distinct and perfectly consistent in every scene. In every scene identify which characters appear and preserve their exact appearance and costumes. Provide separate solo reference image prompts for all four characters and group image prompts where needed. LANGUAGE: Follow outputLanguage in the project brief. If Hindi is selected, ALL narration, voiceover, character dialogues, spoken lines and quotes MUST be natural Hindi in Devanagari. Do not write spoken content in English or Hinglish. If English or Hinglish is selected, follow that language consistently. Every scene must include narration and speaker-labelled dialogues. Keep image prompts and video prompts in detailed English for AI visual tools. Include scene-by-scene narration, dialogue, image prompts, video prompts and sound design. Maintain strict character and voice consistency. Use this project brief:\\\\n'+JSON.stringify(brief,null,2);const payload=JSON.stringify({...brief,prompt});AndroidBridge.callAiBackend(endpoint,payload)"

          if old_payload not in s:
              raise SystemExit("AI payload code not found")
          s = s.replace(old_payload, new_payload)

          if 'type="hidden" value="https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate"' not in s:
              raise SystemExit("Backend field replacement failed")
                    # Add separate copy buttons for every prompt category
          toolbar = '<div id="copyTools" class="actions" style="flex-wrap:wrap;margin-top:12px"></div>'
          anchor = '<div class="actions"><button class="btn primary" onclick="generatePrompt()">'
          if anchor not in s:
              raise SystemExit("Copy button location not found")
          s = s.replace(anchor, toolbar + anchor, 1)

          # Require fixed headings in AI output so each section can be copied separately
          old_labels = "Include scene-by-scene narration, dialogue, image prompts, video prompts and sound design."
          new_labels = "REQUIRED OUTPUT LABELS: Put each label on its own line exactly as follows: CHARACTER REFERENCE IMAGE PROMPT: (repeat separately for every character), IMAGE PROMPT: (repeat for every scene), VIDEO PROMPT: (repeat for every scene), NARRATION: (repeat for every scene), DIALOGUE: (repeat for every scene). Keep each section separate; never combine narration and dialogue or image and video prompts."
          if old_labels not in s:
              raise SystemExit("AI output instruction not found")
          s = s.replace(old_labels, new_labels, 1)

          helper = r"""
                     function copySectionText(text,label){
                  if(!text){toast('Nothing to copy');return}
                   if(window.AndroidBridge&&AndroidBridge.copyText){
                    AndroidBridge.copyText(text);toast(label+' copied');return;
                    }
                     const t=document.createElement('textarea');
                    t.value=text;document.body.appendChild(t);t.select();
                    document.execCommand('copy');t.remove();toast(label+' copied');
                    }

           function renderCopyTools(){
            const root=$('copyTools');
           if(!root)return;
            root.innerHTML='';
           if(!generated||!generated.trim())return;

          const kinds=[
          {key:'character',label:'Character Prompt',pattern:/CHARACTER REFERENCE IMAGE PROMPT|CHARACTER PROMPT/i},
          {key:'image',label:'Image Prompt',pattern:/IMAGE PROMPT/i},
          {key:'video',label:'Video Prompt',pattern:/VIDEO PROMPT/i},
          {key:'narration',label:'Narration',pattern:/NARRATION|VOICEOVER/i},
          {key:'dialogue',label:'Dialogue',pattern:/DIALOGUE|SPOKEN LINES/i}
          ];

          const blocks=[];
          let current=null;

          generated.split(/\r?\n/).forEach(line=>{
          const clean=line.replace(/\*\*/g,'').trim();
          const kind=kinds.find(k=>k.pattern.test(clean));
          if(kind){
          current={key:kind.key,label:kind.label,text:line};
          blocks.push(current);
          }else if(current){
          current.text+='\n'+line;
          }
          });

          if(!blocks.length){
          root.textContent='Separate copy buttons will appear when AI output contains the required headings.';
          return;
           }

          kinds.forEach(kind=>{
          const group=blocks.filter(b=>b.key===kind.key);
          if(!group.length)return;

          const all=document.createElement('button');
          all.className='btn secondary';
          all.textContent='Copy All '+kind.label+'s';
          all.onclick=()=>copySectionText(
          group.map(b=>b.text).join('\n\n'),kind.label
          );
          root.appendChild(all);

          group.forEach((block,index)=>{
          const one=document.createElement('button');
          one.className='btn secondary';
          one.textContent='Copy '+kind.label+' '+(index+1);
          one.onclick=()=>copySectionText(
          block.text,kind.label+' '+(index+1)
          );
          root.appendChild(one);
          });
          });
          }
          """
          marker = "function downloadTxt(){"
          if marker not in s:
              raise SystemExit("JavaScript insertion point not found")
          s = s.replace(marker, helper + "\n" + marker, 1)

          # Refresh copy buttons whenever new output is generated
          if "generated=out;$('output')" not in s:
              raise SystemExit("Master prompt output line not found")
          s = s.replace("generated=out;$('output')", "generated=out;renderCopyTools();$('output')", 1)

          if "generated=result;$('output')" not in s:
              raise SystemExit("AI output line not found")
          s = s.replace("generated=result;$('output')", "generated=result;renderCopyTools();$('output')", 1)

          # Clear old copy buttons when workspace is reset
          s = s.replace("generated='';$('output')", "generated='';renderCopyTools();$('output')", 1)
          p.write_text(s, encoding="utf-8")
          print("Backend and character defaults updated.")
          PY
        
      - name: Find backend URL prompt
        run: |
            echo "---- Backend URL code search ----"
            grep -RniE 'Secure Backend|Backend HTTPS|prompt\(|localStorage' AI3DStoryStudio/app/src/main/assets || true
      
      - name: Find backend URL configuration
        run: |
          echo "---- Aspect Ratio references ----"
          grep -RniE '16:9|9:16|aspectRatio|aspect-ratio|ratio' AI3DStoryStudio/app/src/main/assets || true
          echo "---- Backend references in Android project ----"
          grep -RniE 'Secure Backend|Backend HTTPS|aiEndpoint|backendUrl|backend_url|SharedPreferences|AlertDialog|EditText|prompt\(' AI3DStoryStudio/app/src/main || true
          echo "---- AI Brief and Ratio Function ----"
          grep -n -A35 -B5 'collectAiBrief' AI3DStoryStudio/app/src/main/assets/index.html || true
          echo "---- Ratio and AI Request Code ----"
          grep -oE '.{0,100}(ratio|aspect|collectAiBrief|fetch\().{0,180}' AI3DStoryStudio/app/src/main/assets/index.html | head -40 || true
          echo "---- Generate Function Ending and AI Request ----"
          grep -n -oE '.{0,100}(generatePrompt|collectAiBrief|JSON.stringify|fetch\\(|/generate|aspectRatio|ratio).{0,200}' AI3DStoryStudio/app/src/main/assets/index.html | tail -30 || true
     
      - name: Set Android Java compatibility to 17
        run: |
          echo "---- Full HTML source (lines 1-100) ----"
          nl -ba AI3DStoryStudio/app/src/main/assets/index.html | sed -n '1,100p'
      
      - name: Set Android Java compatibility to 17
        run: |
          cat >> AI3DStoryStudio/app/build.gradle.kts <<'EOF'

                   android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF


      - name: Check JVM Settings
        run: |
          grep -RInE 'jvmTarget|sourceCompatibility|targetCompatibility|VERSION_1_8|VERSION_17' AI3DStoryStudio --include='*.gradle' --include='*.gradle.kts' || true
      
      - name: Build APK
        run: |
          cd AI3DStoryStudio
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI3DStoryStudio-debug-apk
          path: AI3DStoryStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
