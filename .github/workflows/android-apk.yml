
name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q AI3DStoryStudio_GitHub_Actions_Build.zip

      - name: Fix backend and character defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AI3DStoryStudio/app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '<div class="field"><label>SECURE BACKEND HTTPS URL</label><input id="aiEndpoint" type="url" placeholder="https://your-secure-server.example/generate"></div>',
              '<input id="aiEndpoint" type="hidden" value="https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate">'
          )
          s = s.replace(
              "age:val('charAge','As appropriate'),appearance:val('appearance')",
              "age:val('charAge','Automatically determine a suitable age from the story'),appearance:val('appearance','Automatically create a detailed character appearance and costume, then keep it identical in every scene')"
          )
          s = s.replace(
              "const endpoint=val('aiEndpoint');",
              "const endpoint=val('aiEndpoint','https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate');"
          )
          
          old_payload = "const payload=JSON.stringify(collectAiBrief());AndroidBridge.callAiBackend(endpoint,payload)"
          new_payload = "const brief=collectAiBrief();const prompt='You are an expert cinematic story production assistant. Create a complete scene-by-scene production blueprint with narration, image prompts, video prompts and sound design. Maintain strict character and voice consistency. Use this project brief:\\n'+JSON.stringify(brief,null,2);const payload=JSON.stringify({...brief,prompt});AndroidBridge.callAiBackend(endpoint,payload)"
          if old_payload not in s:
              raise SystemExit("AI payload code not found")
          s = s.replace(old_payload, new_payload)

          if 'type="hidden" value="https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate"' not in s:
              raise SystemExit("Backend field replacement failed")
          p.write_text(s, encoding="utf-8")
          print("Backend and character defaults updated.")
          PY
        
      - name: Find backend URL prompt
        run: |
            echo "---- Backend URL code search ----"
            grep -RniE 'Secure Backend|Backend HTTPS|prompt\(|localStorage' AI3DStoryStudio/app/src/main/assets || true
      
      - name: Find backend URL configuration
        run: |
          echo "---- Backend references in Android project ----"
          grep -RniE 'Secure Backend|Backend HTTPS|aiEndpoint|backendUrl|backend_url|SharedPreferences|AlertDialog|EditText|prompt\(' AI3DStoryStudio/app/src/main || true

      - name: Set Android Java compatibility to 17
        run: |
          echo "---- Full HTML source (lines 1-100) ----"
          nl -ba AI3DStoryStudio/app/src/main/assets/index.html | sed -n '1,100p'
      
      - name: Set Android Java compatibility to 17
        run: |
          cat >> AI3DStoryStudio/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF


      - name: Check JVM Settings
        run: |
          grep -RInE 'jvmTarget|sourceCompatibility|targetCompatibility|VERSION_1_8|VERSION_17' AI3DStoryStudio --include='*.gradle' --include='*.gradle.kts' || true
      
      - name: Build APK
        run: |
          cd AI3DStoryStudio
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI3DStoryStudio-debug-apk
          path: AI3DStoryStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
