
name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q AI3DStoryStudio_GitHub_Actions_Build.zip

      - name: Export source files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: AI3DStoryStudio-source-inspection
          path: |
            AI3DStoryStudio/app/src/main/assets/index.html
            AI3DStoryStudio/app/src/main/java/com/example/ai3dstorystudio/MainActivity.kt
          if-no-files-found: error  

      - name: Fix backend and character defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AI3DStoryStudio/app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
                    # Hide manual age and appearance fields; let AI infer them from the story
          old_age = '<div class="grid"><div class="field"><label>CHARACTER NAME</label><input id="charName" placeholder="e.g. Ashwatthama"></div><div class="field"><label>AGE / AGE RANGE</label><input id="charAge" placeholder="e.g. 35 years"></div></div>'
          new_age = '<div class="field"><label>CHARACTER NAME</label><input id="charName" placeholder="e.g. Ashwatthama"></div><input id="charAge" type="hidden" value="Automatically determine a suitable age from the story">'
          if old_age not in s:
              raise SystemExit("Character age field not found")
          s = s.replace(old_age, new_age, 1)

          old_appearance = '<div class="field"><label>FIXED PHYSICAL APPEARANCE & COSTUME</label><textarea id="appearance" style="min-height:75px" placeholder="Face, hair, body build, costume, colors, accessories..."></textarea></div>'
          new_appearance = '<input id="appearance" type="hidden" value="Automatically create a detailed character appearance and costume from the story, then keep it identical in every scene">'
          if old_appearance not in s:
              raise SystemExit("Character appearance field not found")
          s = s.replace(old_appearance, new_appearance, 1)

          s = s.replace(
              "document.querySelectorAll('input:not([type=checkbox]),textarea').forEach(e=>e.value='');",
              "document.querySelectorAll('input:not([type=checkbox]),textarea').forEach(e=>e.value='');$('charAge').value='Automatically determine a suitable age from the story';$('appearance').value='Automatically create a detailed character appearance and costume from the story, then keep it identical in every scene';",
              1
          )
          s = s.replace(
              '<div class="field"><label>SECURE BACKEND HTTPS URL</label><input id="aiEndpoint" type="url" placeholder="https://your-secure-server.example/generate"></div>',
              '<input id="aiEndpoint" type="hidden" value="https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate">'
          )
          s = s.replace(
              "age:val('charAge','As appropriate'),appearance:val('appearance')",
              "age:val('charAge','Automatically determine a suitable age from the story'),appearance:val('appearance','Automatically create a detailed character appearance and costume, then keep it identical in every scene')"
          )
          s = s.replace(
              "const endpoint=val('aiEndpoint');",
              "const endpoint=val('aiEndpoint','https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate');"
          )
          
          old_payload = "const payload=JSON.stringify(collectAiBrief());AndroidBridge.callAiBackend(endpoint,payload)"
         
          new_payload = "const brief=collectAiBrief();const prompt='You are an expert cinematic story production assistant. Create a complete scene-by-scene production blueprint. IMPORTANT: Create at least FOUR distinct recurring lead characters suitable for the story. For each character provide name, role, age, detailed face, hair, body build, costume, colors, accessories, personality, voice identity and a separate detailed CHARACTER REFERENCE IMAGE PROMPT. Keep all four characters visually distinct and perfectly consistent in every scene. In every scene identify which characters appear and preserve their exact appearance and costumes. Provide separate solo reference image prompts for all four characters and group image prompts where needed. LANGUAGE: Follow outputLanguage in the project brief. If Hindi is selected, ALL narration, voiceover, character dialogues, spoken lines and quotes MUST be natural Hindi in Devanagari. Do not write spoken content in English or Hinglish. If English or Hinglish is selected, follow that language consistently. Every scene must include narration and speaker-labelled dialogues. Keep image prompts and video prompts in detailed English for AI visual tools. Include scene-by-scene narration, dialogue, image prompts, video prompts and sound design. Maintain strict character and voice consistency. Use this project brief:\\\\n'+JSON.stringify(brief,null,2);const payload=JSON.stringify({...brief,prompt});AndroidBridge.callAiBackend(endpoint,payload)"

          if old_payload not in s:
              raise SystemExit("AI payload code not found")
          s = s.replace(old_payload, new_payload)

          if 'type="hidden" value="https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate"' not in s:
              raise SystemExit("Backend field replacement failed")
                    # Add separate copy buttons for every prompt category
          toolbar = '<div id="copyTools" class="actions" style="flex-wrap:wrap;margin-top:12px"></div>'
          anchor = '<div class="actions"><button class="btn primary" onclick="generatePrompt()">'
          if anchor not in s:
              raise SystemExit("Copy button location not found")
          s = s.replace(anchor, toolbar + anchor, 1)

          # Require fixed headings in AI output so each section can be copied separately
          old_labels = "Include scene-by-scene narration, dialogue, image prompts, video prompts and sound design."
          new_labels = "REQUIRED OUTPUT LABELS: Put each label on its own line exactly as follows: CHARACTER REFERENCE IMAGE PROMPT: (repeat separately for every character), IMAGE PROMPT: (repeat for every scene), VIDEO PROMPT: (repeat for every scene), NARRATION: (repeat for every scene), DIALOGUE: (repeat for every scene). ASPECT RATIO LOCK: The selected aspect ratio in the project brief is mandatory. If aspectRatio is 16:9, every image prompt and video prompt must explicitly specify 16:9 landscape widescreen framing. If aspectRatio is 9:16, every image prompt and video prompt must explicitly specify 9:16 vertical portrait framing. Never use the opposite ratio. Include the selected ratio explicitly in each scene IMAGE PROMPT and VIDEO PROMPT.. Keep each section separate; never combine narration and dialogue or image and video prompts."
          if old_labels not in s:
              raise SystemExit("AI output instruction not found")
          s = s.replace(old_labels, new_labels, 1)

          helper = r"""
                     function copySectionText(text,label){
                  if(!text){toast('Nothing to copy');return}
                   if(window.AndroidBridge&&AndroidBridge.copyText){
                    AndroidBridge.copyText(text);toast(label+' copied');return;
                    }
                     const t=document.createElement('textarea');
                    t.value=text;document.body.appendChild(t);t.select();
                    document.execCommand('copy');t.remove();toast(label+' copied');
                    }

           function renderCopyTools(){
            const root=$('copyTools');
           if(!root)return;
            root.innerHTML='';
           if(!generated||!generated.trim())return;

          const kinds=[
          {key:'character',label:'Character Prompt',pattern:/CHARACTER REFERENCE IMAGE PROMPT|CHARACTER PROMPT/i},
          {key:'image',label:'Image Prompt',pattern:/IMAGE PROMPT/i},
          {key:'video',label:'Video Prompt',pattern:/VIDEO PROMPT/i},
          {key:'narration',label:'Narration',pattern:/NARRATION|VOICEOVER/i},
          {key:'dialogue',label:'Dialogue',pattern:/DIALOGUE|SPOKEN LINES/i}
          ];

          const blocks=[];
          let current=null;

          generated.split(/\r?\n/).forEach(line=>{
          const clean=line.replace(/\*\*/g,'').trim();
          const kind=kinds.find(k=>k.pattern.test(clean));
          if(kind){
          current={key:kind.key,label:kind.label,text:line};
          blocks.push(current);
          }else if(current){
          current.text+='\n'+line;
          }
          });

          if(!blocks.length){
          root.textContent='Separate copy buttons will appear when AI output contains the required headings.';
          return;
           }

          kinds.forEach(kind=>{
          const group=blocks.filter(b=>b.key===kind.key);
          if(!group.length)return;

          const all=document.createElement('button');
          all.className='btn secondary';
          all.textContent='Copy All '+kind.label+'s';
          all.onclick=()=>copySectionText(
          group.map(b=>b.text).join('\n\n'),kind.label
          );
          root.appendChild(all);

          group.forEach((block,index)=>{
          const one=document.createElement('button');
          one.className='btn secondary';
          one.textContent='Copy '+kind.label+' '+(index+1);
          one.onclick=()=>copySectionText(
          block.text,kind.label+' '+(index+1)
          );
          root.appendChild(one);
          });
          });
          }
          """
          marker = "function downloadTxt(){"
          if marker not in s:
              raise SystemExit("JavaScript insertion point not found")
          s = s.replace(marker, helper + "\n" + marker, 1)

          # Refresh copy buttons whenever new output is generated
          if "generated=out;$('output')" not in s:
              raise SystemExit("Master prompt output line not found")
          s = s.replace("generated=out;$('output')", "generated=out;renderCopyTools();$('output')", 1)

          if "generated=result;$('output')" not in s:
              raise SystemExit("AI output line not found")
          s = s.replace("generated=result;$('output')", "generated=result;renderCopyTools();$('output')", 1)

          # Clear old copy buttons when workspace is reset
          s = s.replace("generated='';$('output')", "generated='';renderCopyTools();$('output')", 1)
          p.write_text(s, encoding="utf-8")
          print("Backend and character defaults updated.")
          PY

      
      - name: Add scene image generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("AI3DStoryStudio/app/src/main")
          h=root/"assets/index.html"; s=h.read_text(encoding='utf-8')
          anchor='<p class="foot">AI 3D STORY STUDIO (DJ) · CREATE WITH CONSISTENCY · VERSION 1.1</p>'
          section='''<section class="card" id="sceneImageCard"><div class="cardhead"><div class="num">07</div><div><h2>Scene Image Generator</h2><p class="hint">Generate one image for every scene, in order, using your selected aspect ratio</p></div></div><button class="btn primary" id="generateSceneImagesBtn" onclick="generateAllSceneImages()">✦ GENERATE ALL SCENE IMAGES</button><p class="hint" id="imageProgress" aria-live="polite">Generate the Master TXT first, then create your scene images.</p><div id="sceneImageGallery" class="scene-image-gallery"></div></section>'''
          if 'id="sceneImageCard"' not in s:
              if anchor not in s: raise SystemExit('HTML gallery insertion anchor not found')
              s=s.replace(anchor,section+'\n'+anchor,1)
          css='''\n.scene-image-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:14px}.scene-image-item{background:#091321;border:1px solid var(--line);border-radius:12px;padding:9px;min-width:0}.scene-image-item img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#050a12;border-radius:8px}.scene-image-item p{font-size:12px;color:var(--muted);margin:8px 0}.scene-image-item button{width:100%;margin-top:4px}.scene-image-gallery:empty{display:none}\n'''
          if '.scene-image-gallery{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          marker='function downloadTxt(){'
          js=r'''let imageRequestResolver=null;
          function extractSceneImagePrompts(text){
           const re=/(?:^|\n)\s*IMAGE PROMPT:\s*([\s\S]*?)(?=\n\s*(?:VIDEO(?:\s*\/\s*MOTION)?\s*PROMPT|SOUND DESIGN|NARRATION|VOICEOVER|DIALOGUE|SCENE\s+\d+|6\.\s*EDITING|END OF MASTER PROMPT)\s*:?\s*|$)/gi;
           return [...text.matchAll(re)].map(m=>m[1].trim()).filter(Boolean);
          }
          window.onImageBackendResult=function(ok,response){if(!imageRequestResolver)return;const done=imageRequestResolver;imageRequestResolver=null;done({ok,response});};
          function requestSceneImage(prompt){return new Promise((resolve,reject)=>{if(!window.AndroidBridge||!AndroidBridge.callImageBackend){reject(new Error('Image generation is available in the Android app.'));return;}imageRequestResolver=resolve;try{AndroidBridge.callImageBackend(JSON.stringify({prompt}));}catch(e){imageRequestResolver=null;reject(e);}});}
          async function generateAllSceneImages(){
           if(!generated||!generated.trim()){toast('Generate the Master TXT first');return;}
           const prompts=extractSceneImagePrompts(generated);
           if(!prompts.length){toast('No IMAGE PROMPT sections found in the generated text');$('imageProgress').textContent='The output must contain a separate IMAGE PROMPT: for each scene.';return;}
           const button=$('generateSceneImagesBtn');button.disabled=true;$('sceneImageGallery').innerHTML='';
           const gallery=$('sceneImageGallery');let completed=0;
           $('imageProgress').textContent='Preparing '+prompts.length+' scene images. Images are generated one at a time.';
           try{
            for(let i=0;i<prompts.length;i++){
             $('imageProgress').textContent='Generating scene image '+(i+1)+' of '+prompts.length+'…';
             const fullPrompt=prompts[i]+'\n\nMANDATORY OUTPUT FRAME: '+ratio+'. Visual style and character appearance must remain consistent with the other scenes. No watermark, no captions, no random text.';
             const result=await requestSceneImage(fullPrompt);
             if(!result.ok)throw new Error(String(result.response).slice(0,240));
             const data=JSON.parse(result.response);
             const dataUri=data.dataURI||data.image||data.imageData;
             if(!data.success||typeof dataUri!=='string'||!dataUri.startsWith('data:image/'))throw new Error(data.error||'Image server returned no valid image.');
             const card=document.createElement('div');card.className='scene-image-item';
             const img=document.createElement('img');img.alt='Generated image for scene '+(i+1);img.src=dataUri;
             const label=document.createElement('p');label.textContent='Scene '+String(i+1).padStart(2,'0');
             const save=document.createElement('button');save.className='btn secondary';save.textContent='↓ Save Image';
             save.onclick=()=>{if(window.AndroidBridge&&AndroidBridge.saveImageFile){AndroidBridge.saveImageFile('AI3D_Scene_'+String(i+1).padStart(2,'0')+'.jpg',dataUri);}else{const a=document.createElement('a');a.href=dataUri;a.download='AI3D_Scene_'+String(i+1).padStart(2,'0')+'.jpg';a.click();}};
             card.appendChild(img);card.appendChild(label);card.appendChild(save);gallery.appendChild(card);completed++;
            }
            $('imageProgress').textContent='Complete: '+completed+' of '+prompts.length+' scene images generated. Save each image below.';toast('All scene images generated');
           }catch(e){$('imageProgress').textContent='Stopped after '+completed+' image(s): '+(e.message||'Image generation failed')+'. Tap Generate All to try again.';toast('Image generation stopped');}
           finally{button.disabled=false;}
          }
          '''
          if 'function generateAllSceneImages()' not in s:
              if marker not in s: raise SystemExit('HTML JavaScript insertion anchor not found')
              s=s.replace(marker,js+'\n'+marker,1)
          h.write_text(s,encoding='utf-8')

          k=root/"java/com/example/ai3dstorystudio/MainActivity.kt"; t=k.read_text(encoding='utf-8')
          if 'import android.util.Base64' not in t: t=t.replace('import android.widget.Toast','import android.widget.Toast\nimport android.util.Base64',1)
          if 'private var pendingImageBytes' not in t: t=t.replace('private var pendingText: String = ""','private var pendingText: String = ""\n    private var pendingImageBytes: ByteArray = byteArrayOf()',1)
          launcher='''\n    private val createImageFile = registerForActivityResult(
          ActivityResultContracts.CreateDocument("image/jpeg")
           ) { uri ->
           if (uri != null) {
            try {
                contentResolver.openOutputStream(uri)?.use { it.write(pendingImageBytes) }
                Toast.makeText(this, "Image saved", Toast.LENGTH_SHORT).show()
            } catch (_: Exception) {
                Toast.makeText(this, "Could not save image", Toast.LENGTH_SHORT).show()
            }
            }
           pendingImageBytes = byteArrayOf()
           }
           '''
          if 'private val createImageFile' not in t:
              pos=t.find('\n    private val openImage')
              if pos<0: raise SystemExit('Kotlin launcher insertion anchor not found')
              t=t[:pos]+launcher+t[pos:]
          methods='''\n        @JavascriptInterface fun saveImageFile(filename: String, dataUri: String) {
            try {
                val encoded = dataUri.substringAfter(",", "")
                if (!dataUri.startsWith("data:image/") || encoded.isBlank() || encoded.length > 18_000_000) {
                    runOnUiThread { Toast.makeText(this@MainActivity, "Invalid or oversized image", Toast.LENGTH_SHORT).show() }
                    return
                }
                val bytes = Base64.decode(encoded, Base64.DEFAULT)
                if (bytes.isEmpty() || bytes.size > 12_000_000) throw IllegalArgumentException("Image is too large")
                runOnUiThread {
                    pendingImageBytes = bytes
                    val safe = filename.replace(Regex("[^a-zA-Z0-9._-]"), "_").ifBlank { "AI3D_Scene.jpg" }
                    createImageFile.launch(if (safe.endsWith(".jpg", true) || safe.endsWith(".jpeg", true)) safe else "$safe.jpg")
                }
            } catch (_: Exception) {
                runOnUiThread { Toast.makeText(this@MainActivity, "Could not prepare image", Toast.LENGTH_SHORT).show() }
            }
            }
           @JavascriptInterface fun callImageBackend(payload: String) {
            val endpoint = "https://ai-3d-story-studio.dhnnjkmr39.workers.dev/generate-image"
            if (payload.length > 100_000) {
                runOnUiThread { webView.evaluateJavascript("window.onImageBackendResult && window.onImageBackendResult(false, 'Image prompt is too large.')", null) }
                return
            }
            Thread {
                var connection: HttpURLConnection? = null
                try {
                    connection = (URL(endpoint).openConnection() as HttpURLConnection).apply {
                        requestMethod = "POST"
                        connectTimeout = 30000
                        readTimeout = 180000
                        doOutput = true
                        setRequestProperty("Content-Type", "application/json; charset=utf-8")
                        setRequestProperty("Accept", "application/json")
                    }
                    connection.outputStream.use { it.write(payload.toByteArray(Charsets.UTF_8)) }
                    val status = connection.responseCode
                    val stream = if (status in 200..299) connection.inputStream else connection.errorStream
                    val response = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText().take(15_000_000) } ?: ""
                    val ok = status in 200..299
                    val jsResponse = JSONObject.quote(response.ifBlank { "HTTP $status" })
                    runOnUiThread { webView.evaluateJavascript("window.onImageBackendResult && window.onImageBackendResult(${if (ok) "true" else "false"}, $jsResponse)", null) }
                } catch (e: Exception) {
                    val message = JSONObject.quote(e.message ?: "Image network request failed")
                    runOnUiThread { webView.evaluateJavascript("window.onImageBackendResult && window.onImageBackendResult(false, $message)", null) }
                } finally {
                    connection?.disconnect()
                }
            }.start()
           }
          '''
          if 'fun callImageBackend(payload: String)' not in t:
              anchor='''        @JavascriptInterface fun callAiBackend(endpoint: String, payload: String) {'''
              if anchor not in t: raise SystemExit('Kotlin bridge insertion anchor not found')
              t=t.replace(anchor,methods+'\n'+anchor,1)
          k.write_text(t,encoding='utf-8')
          print('PATCH_OK')
          PY
        
      - name: Find backend URL prompt
        run: |
            echo "---- Backend URL code search ----"
            grep -RniE 'Secure Backend|Backend HTTPS|prompt\(|localStorage' AI3DStoryStudio/app/src/main/assets || true
      
      - name: Find backend URL configuration
        run: |
          echo "---- Aspect Ratio references ----"
          grep -RniE '16:9|9:16|aspectRatio|aspect-ratio|ratio' AI3DStoryStudio/app/src/main/assets || true
          echo "---- Backend references in Android project ----"
          grep -RniE 'Secure Backend|Backend HTTPS|aiEndpoint|backendUrl|backend_url|SharedPreferences|AlertDialog|EditText|prompt\(' AI3DStoryStudio/app/src/main || true
          echo "---- AI Brief and Ratio Function ----"
          grep -n -A35 -B5 'collectAiBrief' AI3DStoryStudio/app/src/main/assets/index.html || true
          echo "---- Ratio and AI Request Code ----"
          grep -oE '.{0,100}(ratio|aspect|collectAiBrief|fetch\().{0,180}' AI3DStoryStudio/app/src/main/assets/index.html | head -40 || true
          echo "---- Generate Function Ending and AI Request ----"
          grep -n -oE 'generatePrompt|collectAiBrief|JSON.stringify|fetch|/generate|aspectRatio|ratio' AI3DStoryStudio/app/src/main/assets/index.html | tail -40 || true
          echo "---- Ratio Data Flow Details ----"
          grep -oE '.{0,100}(aspectRatio|/generate|collectAiBrief|JSON.stringify|fetch).{0,160}' AI3DStoryStudio/app/src/main/assets/index.html | tail -30 || true
     
      - name: Set Android Java compatibility to 17
        run: |
          echo "---- Full HTML source (lines 1-100) ----"
          nl -ba AI3DStoryStudio/app/src/main/assets/index.html | sed -n '1,100p'
      
      - name: Set Android Java compatibility to 17
        run: |
          cat >> AI3DStoryStudio/app/build.gradle.kts <<'EOF'

                   android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF


      - name: Check JVM Settings
        run: |
          grep -RInE 'jvmTarget|sourceCompatibility|targetCompatibility|VERSION_1_8|VERSION_17' AI3DStoryStudio --include='*.gradle' --include='*.gradle.kts' || true
      
      - name: Inspect Android Bridge
        run: |
          echo "---- Android Java/Kotlin files ----"
          find AI3DStoryStudio/app/src/main -type f \( -name '*.java' -o -name '*.kt' \) -print

          echo "---- AndroidBridge implementation ----"
          grep -RniE 'AndroidBridge|callAiBackend|no API key|API key|GEMINI_API_KEY' AI3DStoryStudio/app/src/main --include='*.java' --include='*.kt' --include='*.html' || true
          echo "---- MainActivity.kt full code ----"
          nl -ba AI3DStoryStudio/app/src/main/java/com/example/ai3dstorystudio/MainActivity.kt | sed -n '1,180p'
          echo "---- AI backend response handler ----"
          grep -n -A 35 -B 5 'onAiBackendResult' AI3DStoryStudio/app/src/main/assets/index.html || true
     
      - name: Build APK
        run: |
          cd AI3DStoryStudio
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI3DStoryStudio-debug-apk
          path: AI3DStoryStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
