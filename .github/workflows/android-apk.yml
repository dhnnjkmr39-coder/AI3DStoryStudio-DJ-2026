
name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q AI3DStoryStudio_GitHub_Actions_Build.zip

      - name: Find backend URL prompt
       run: |
            echo "---- Backend URL code search ----"
            grep -RniE 'Secure Backend|Backend HTTPS|prompt\(|localStorage' AI3DStoryStudio/app/src/main/assets || true
     
      - name: Set Android Java compatibility to 17
        run: |
          cat >> AI3DStoryStudio/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF


      - name: Check JVM Settings
        run: |
          grep -RInE 'jvmTarget|sourceCompatibility|targetCompatibility|VERSION_1_8|VERSION_17' AI3DStoryStudio --include='*.gradle' --include='*.gradle.kts' || true
      
      - name: Build APK
        run: |
          cd AI3DStoryStudio
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI3DStoryStudio-debug-apk
          path: AI3DStoryStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
